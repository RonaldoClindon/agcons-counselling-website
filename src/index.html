<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Professional Counselling &amp; Mental Wellness | [AGCONS - For UR PEACE]</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Professional and confidential counselling services providing a safe and supportive space for personal growth, emotional wellbeing and positive change.">
  <meta name="theme-color" content="#1f3a34">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="[AGCONS - For UR PEACE]">
  <meta property="og:title" content="Professional Counselling & Mental Wellness | [AGCONS - For UR PEACE]">
  <meta property="og:description" content="Professional and confidential counselling services providing a safe and supportive space for personal growth, emotional wellbeing and positive change.">
  <meta property="og:image" content="/images/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/png" href="/assets/Meditation.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  </head>
<body>
  <app-root></app-root>

  <!--
    Hidden static forms so Netlify can detect them at deploy time.
    Angular submits the real data to these form names ("booking" and "contact").
    Do not delete this block if you use Netlify Forms.
  -->
  <form name="booking" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="booking">
    <input name="bot-field"><input name="subject">
    <input name="Name"><input name="Email"><input name="Phone"><input name="WhatsApp">
    <input name="Preferred Date"><input name="Preferred Time"><input name="Counselling Type">
    <input name="Session Mode"><textarea name="Message"></textarea>
  </form>
  <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="contact">
    <input name="bot-field"><input name="subject">
    <input name="Name"><input name="Email"><textarea name="Message"></textarea>
  </form>
</body>
</html>
